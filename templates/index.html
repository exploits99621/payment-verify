<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FamPay Payment Gateway</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💳 <span>FamPay</span> Gateway</h1>
            <p>Secure & Fast UPI Payments</p>
        </div>
        
        <div class="payment-form">
            <h2>Make a Payment</h2>
            <form action="{{ url_for('create_payment_route') }}" method="POST">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" name="amount" 
                           placeholder="Enter amount" min="1" step="0.01" required>
                </div>
                
                <div class="form-group">
                    <label for="customer_name">Full Name</label>
                    <input type="text" id="customer_name" name="customer_name" 
                           placeholder="Your full name">
                </div>
                
                <div class="form-group">
                    <label for="customer_email">Email</label>
                    <input type="email" id="customer_email" name="customer_email" 
                           placeholder="your@email.com">
                </div>
                
                <div class="form-group">
                    <label for="customer_phone">Phone Number</label>
                    <input type="tel" id="customer_phone" name="customer_phone" 
                           placeholder="9876543210">
                </div>
                
                <button type="submit" class="btn-primary">Pay Now</button>
            </form>
        </div>
        
        <div class="features">
            <div class="feature">
                <span>🔒</span>
                <h3>Secure</h3>
                <p>256-bit SSL encrypted</p>
            </div>
            <div class="feature">
                <span>⚡</span>
                <h3>Fast</h3>
                <p>Instant UPI payments</p>
            </div>
            <div class="feature">
                <span>📱</span>
                <h3>UPI Support</h3>
                <p>All UPI apps supported</p>
            </div>
        </div>
    </div>
</body>
</html>
